services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bfs_bot
      POSTGRES_USER: bfs_bot
      POSTGRES_PASSWORD: bfs_bot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfs_bot -d bfs_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
