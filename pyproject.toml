[project]
name = "bfs-bot"
version = "0.1.0"
description = "Multi-agent SME credit assistant PoC with mandatory PII redaction."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "faker>=25.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "itsdangerous>=2.2.0",
  "pgvector>=0.3.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pypdf>=4.2.0",
  "pyyaml>=6.0.0",
  "sqlalchemy>=2.0.30",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
bfs-bot-api = "bfs_bot.api:main"
bfs-bot-seed = "bfs_bot.seed:main"
bfs-bot-ingest = "bfs_bot.ingestion:main"

[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bfs_bot = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "eval: scenario matrix and security evaluation tests (may be slower)",
]
